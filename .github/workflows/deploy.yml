name: Build and test

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install frontend dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Run frontend tests
        run: bun run test

      - name: Type-check frontend
        run: bun run typecheck

      - name: Build frontend with non-production Supabase placeholders
        run: bun run build
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

      - name: Install bot dependencies from lockfile
        working-directory: trading-bot
        run: npm ci

      - name: Type-check bot
        working-directory: trading-bot
        run: npm run check

      - name: Run offline bot tests
        working-directory: trading-bot
        run: npm test
